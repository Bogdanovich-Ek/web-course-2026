<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторная работа №6 — Змейка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Змейка</h1>
    <p class="score-label">Счёт: <span id="score">0</span></p>

    <div class="board-wrapper">
      <canvas id="board" width="400" height="400"></canvas>
      <div class="overlay hidden" id="overlay">
        <p class="overlay-title">Игра окончена</p>
        <p class="overlay-score">Ваш счёт: <span id="final-score">0</span></p>
        <button id="restart-btn" class="restart-btn">Начать заново</button>
      </div>
    </div>

    <p class="hint">Управление: стрелки клавиатуры</p>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
