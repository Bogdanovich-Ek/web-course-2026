<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лента постов — бесконечный скролл</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Лента постов</h1>
    <input id="search-input" type="search" placeholder="Поиск по заголовку..." autocomplete="off">
  </header>

  <main>
    <section id="posts" class="posts"></section>

    <p id="not-found" class="message hidden">По вашему запросу ничего не найдено</p>
    <p id="end-message" class="message hidden">Больше постов нет</p>

    <div id="error-box" class="error hidden">
      <p id="error-text"></p>
      <button id="retry-btn" type="button">Повторить</button>
    </div>

    <div id="loader" class="loader hidden">
      <span class="spinner"></span> Загрузка…
    </div>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
