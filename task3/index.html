<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторная №3 — Todo-list</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="todo-app">
    <h1>Список задач</h1>
    
    <form id="todo-form" class="todo-form">
      <input type="text" id="todo-input" placeholder="Введите задачу..." autocomplete="off">
      <button type="submit" class="btn btn-add">Добавить</button>
    </form>
    <p id="warning" class="warning hidden">Поле не может быть пустым!</p>

    <div id="filters" class="filters">
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="active">Активные</button>
      <button class="filter-btn" data-filter="completed">Завершённые</button>
    </div>

    <p id="counter" class="counter">Осталось: 0, Выполнено: 0</p>

    <ul id="todo-list" class="todo-list"></ul>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
